<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TERO - File Compressor</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
  :root {
    --primary-color: #4f46e5;
    --accent-color: #6366f1;
    --bg-light: #f9fafb;
    --bg-dark: #18181b;
    --text-light: #f1f5f9;
    --text-dark: #1f2937;
    --glass-bg: rgba(255, 255, 255, 0.1);
    --glass-border: rgba(255, 255, 255, 0.2);
  }

  * {
    box-sizing: border-box;
    transition: all 0.3s ease-in-out;
  }

  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-light);
    color: var(--text-dark);
    margin: 0;
    padding: 0;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .dark-theme {
    background-color: var(--bg-dark);
    color: var(--text-light);
  }

  header,
  footer {
    background: var(--primary-color);
    color: #fff;
    padding: 1rem 2rem;
    position: relative;
    text-align: center;
  }

  .header-logo {
    position: absolute;
    top: 10px;
    left: 20px;
    height: 40px;
  }

  .logo-text {
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .theme-toggle {
    position: absolute;
    top: 10px;
    right: 20px;
    background: #fff;
    color: var(--primary-color);
    border: none;
    padding: 6px 14px;
    font-weight: 500;
    border-radius: 8px;
    cursor: pointer;
  }

  .container {
    max-width: 760px;
    margin: 50px auto;
    padding: 20px;
  }

  .card {
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
    padding: 32px;
  }

  .card-header {
    font-size: 1.6rem;
    font-weight: 600;
    text-align: center;
    color: var(--primary-color);
    margin-bottom: 1.5rem;
  }

  input[type="file"] {
    display: none;
  }

  .drag-area {
    border: 2px dashed var(--accent-color);
    padding: 30px;
    text-align: center;
    border-radius: 14px;
    background-color: #fff;
    cursor: pointer;
    color: var(--text-dark);
    transition: 0.25s ease-in-out;
  }

  .drag-area.dragover {
    background-color: var(--accent-color);
    color: #fff;
  }

  .btn-primary {
    background-color: var(--primary-color);
    border: none;
    padding: 12px 26px;
    font-weight: 600;
    color: #fff;
    border-radius: 10px;
    display: block;
    margin: 20px auto 0;
    cursor: pointer;
  }

  .btn-primary:hover {
    background-color: #4338ca;
  }

  .upload-history {
    background-color: #fff;
    padding: 20px;
    border-radius: 12px;
    margin-top: 30px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
  }

  .upload-history h5 {
    margin-bottom: 12px;
    font-weight: 600;
    color: var(--text-dark);
  }

  #preview img {
    max-width: 100%;
    max-height: 120px;
    border-radius: 10px;
  }

  footer {
    font-size: 0.875rem;
    margin-top: 80px;
    text-align: center;
  }

  .dark-theme .card,
  .dark-theme .upload-history {
    background-color: #252525;
    color: #eee;
  }

  .dark-theme .drag-area {
    background-color: #2f2f2f;
    border-color: #6366f1;
    color: #ccc;
  }

  .dark-theme .drag-area.dragover {
    background-color: #4f46e5;
    color: #fff;
  }

  .dark-theme .btn-primary {
    background-color: #6366f1;
  }

  .dark-theme .upload-history h5 {
    color: #f1f1f1;
  }

  @media (max-width: 768px) {
    .container {
      padding: 15px;
    }

    .theme-toggle {
      top: 12px;
      right: 16px;
    }

    .header-logo {
      height: 36px;
      top: 12px;
      left: 16px;
    }

    .logo-text {
      font-size: 1.4rem;
    }
  }
</style>
</head>
<body class="dark-theme">
  <header>
    <img src="logo.png" alt="Tero Logo" class="header-logo">
    <div class="logo-text">TERO</div>
    <button class="theme-toggle" onclick="toggleTheme()">Light Mode</button>
  </header>

  <div class="container fade-in">
    <div class="card">
      <div class="card-header">Compress your file here</div>
      <div class="card-body">
        <form id="uploadForm" action="/upload" method="POST" enctype="multipart/form-data">
          <div class="mb-3">
            <label class="form-label">Upload file:</label>
            <div id="dragArea" class="drag-area">
              <p>Drag & Drop your file(s) here or click to select</p>
              <input type="file" name="file" id="file" accept=".txt,.pdf,.doc,.docx,.jpg,.jpeg,.png,.gif,.mp4,.avi,.mov,.opus" required hidden multiple>
            </div>
            <small id="fileInfo" class="form-text"></small>
          </div>
          <div class="text-center">
            <button type="submit" class="btn btn-primary">Compress File</button>
          </div>
        </form>
        <div id="progress" class="progress mt-3" style="display: none;">
          <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 100%;">Compressing...</div>
        </div>
        <div id="result" class="mt-3 text-center"></div>
        <div id="preview" class="mt-3"></div>
      </div>
    </div>

    <div class="upload-history mt-4">
      <h5>Upload History</h5>
      <ul id="uploadHistory" class="list-unstyled mb-0"></ul>
    </div>
  </div>

  <footer>
    © 2024 TERO. All Rights Reserved.
  </footer>

  <script>
    const form = document.getElementById('uploadForm');
    const fileInput = document.getElementById('file');
    const fileInfo = document.getElementById('fileInfo');
    const dragArea = document.getElementById('dragArea');
    const preview = document.getElementById('preview');
    const uploadHistory = document.getElementById('uploadHistory');
    const history = [];

    form.onsubmit = async (e) => {
      e.preventDefault();
      document.getElementById('progress').style.display = 'block';
      const formData = new FormData(form);
      const response = await fetch('/upload', {
        method: 'POST',
        body: formData
      });
      document.getElementById('progress').style.display = 'none';
      const resultText = await response.text();
      document.getElementById('result').innerHTML = `<p><strong>${resultText}</strong></p>`;
      history.push(fileInput.files[0].name);
      updateUploadHistory();
    };

    fileInput.addEventListener('change', () => {
      updateFileInfo();
      showPreview();
    });

    dragArea.addEventListener('click', () => fileInput.click());
    dragArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      dragArea.classList.add('dragover');
    });
    dragArea.addEventListener('dragleave', () => dragArea.classList.remove('dragover'));
    dragArea.addEventListener('drop', (e) => {
      e.preventDefault();
      dragArea.classList.remove('dragover');
      fileInput.files = e.dataTransfer.files;
      updateFileInfo();
      showPreview();
    });

    function updateFileInfo() {
      if (fileInput.files.length > 0) {
        fileInfo.textContent = `${fileInput.files[0].name} (${(fileInput.files[0].size / 1024).toFixed(2)} KB)`;
      }
    }

    function showPreview() {
      const file = fileInput.files[0];
      if (file && file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = () => {
          preview.innerHTML = `<img src="${reader.result}" alt="Preview">`;
        };
        reader.readAsDataURL(file);
      } else {
        preview.innerHTML = '';
      }
    }

    function updateUploadHistory() {
      uploadHistory.innerHTML = history.map(item => `<li>${item}</li>`).join('');
    }

    function toggleTheme() {
      const body = document.body;
      const isDark = body.classList.contains('dark-theme');
      if (isDark) {
        body.classList.remove('dark-theme');
        body.classList.add('light-theme');
        document.querySelector('.theme-toggle').textContent = 'Dark Mode';
      } else {
        body.classList.remove('light-theme');
        body.classList.add('dark-theme');
        document.querySelector('.theme-toggle').textContent = 'Light Mode';
      }
    }
  </script>
</body>
</html>
